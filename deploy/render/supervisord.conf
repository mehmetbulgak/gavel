[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/gavel-supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /tmp/gavel-postgres
priority=10
autorestart=true
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:rabbitmq]
command=/opt/rabbitmq/sbin/rabbitmq-server
priority=30
autorestart=true
stopwaitsecs=30
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:identity]
command=/app/deploy/start-service.sh identity
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:auctions]
command=/app/deploy/start-service.sh auctions
priority=50
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:notifications]
command=/app/deploy/start-service.sh notifications
priority=60
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:gateway]
command=/app/deploy/start-service.sh gateway
priority=70
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:web]
command=/usr/sbin/nginx -c /tmp/gavel-nginx.conf -g "daemon off;"
priority=90
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
